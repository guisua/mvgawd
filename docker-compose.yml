version: '3.8'

services:
  mvgawd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvgawd
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    environment:
      # MQTT Broker Configuration
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-localhost}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      
      # Awtrix Display Configuration
      - AWTRIX_TOPIC_PREFIX=${AWTRIX_TOPIC_PREFIX:-awtrix}
      - AWTRIX_RAW_MESSAGE_SUBTOPIC=${AWTRIX_RAW_MESSAGE_SUBTOPIC:-custom/mvg}
      
      # MVG Stop Configuration (colors are hex RGB: RRGGBB,
      # lines are comma-separated line labels, destinations are
      # comma-separated destination names (partial match); empty for all)
      - STOP_1_ID=${STOP_1_ID:-de:09162:1602:2:1}
      - STOP_1_LINES=${STOP_1_LINES:-}
      - STOP_1_DESTINATIONS=${STOP_1_DESTINATIONS:-}
      - STOP_1_BG_COLOR=${STOP_1_BG_COLOR:-FF0000}
      - STOP_1_FG_COLOR=${STOP_1_FG_COLOR:-FFFFFF}
      - STOP_2_ID=${STOP_2_ID:-de:09162:280:51:52}
      - STOP_2_LINES=${STOP_2_LINES:-}
      - STOP_2_DESTINATIONS=${STOP_2_DESTINATIONS:-}
      - STOP_2_BG_COLOR=${STOP_2_BG_COLOR:-915900}
      - STOP_2_FG_COLOR=${STOP_2_FG_COLOR:-FFFFFF}
      
      # Update Interval
      - UPDATE_INTERVAL_SECONDS=${UPDATE_INTERVAL_SECONDS:-10}
